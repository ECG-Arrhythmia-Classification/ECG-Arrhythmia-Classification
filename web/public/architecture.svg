<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">ECG Studio — System Architecture</title><desc id="desc">Dataset to preprocessing, three parallel models, evaluation and web integration. Browser demo or FastAPI checkpoint inference.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7e98ab"/></marker><style>text{font-family:Arial,sans-serif;fill:#17364e} .title{font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:600}.small{font-size:15px;fill:#648096}.box{fill:#f5f9fc;stroke:#ccdae5;stroke-width:2}.line{fill:none;stroke:#7e98ab;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1400" height="650" fill="white"/><text x="55" y="65" class="title">ECG Studio · System Architecture</text><rect class="box" x="55" y="215" width="205" height="120" rx="12"/><text x="80" y="257" class="heading">Dataset &amp; ECG</text><text x="80" y="286" class="small">CSV / JSON / demo sample</text><path class="line" d="M260 275H300"/><rect class="box" x="300" y="215" width="220" height="120" rx="12"/><text x="322" y="257" class="heading">Preprocessing</text><text x="322" y="286" class="small">Team: bandpass · Z-score</text><path class="line" d="M520 275H554V170H590"/><path class="line" d="M520 275H590"/><path class="line" d="M520 275H554V380H590"/><g fill="#eef8f3" stroke="#b2d9c6" stroke-width="2"><rect x="590" y="132" width="205" height="76" rx="10"/><rect x="590" y="237" width="205" height="76" rx="10"/><rect x="590" y="342" width="205" height="76" rx="10"/></g><text x="613" y="161" class="heading">1D CNN</text><text x="613" y="266" class="heading">BiLSTM / GRU</text><text x="613" y="371" class="heading">Transformer</text><path class="line" d="M795 170H830V275H860"/><path class="line" d="M795 275H860"/><path class="line" d="M795 380H830V275H860"/><rect class="box" x="860" y="215" width="200" height="120" rx="12"/><text x="882" y="257" class="heading">Evaluation</text><text x="882" y="286" class="small">Test set · F1 · robustness</text><path class="line" d="M1060 275H1100"/><rect x="1100" y="215" width="245" height="120" rx="12" fill="#112b43"/><text x="1125" y="257" font-size="20" font-weight="600" style="fill:white">Web demo</text><text x="1125" y="286" font-size="15" style="fill:#a8c9d6">Class · probabilities · chart</text><rect class="box" x="55" y="478" width="1290" height="117" rx="12"/><text x="80" y="514" class="heading">Runtime: raw heartbeat → validation → preprocessing → inference adapter → result</text><text x="80" y="545" class="small">Browser demo: 256-sample prototype scorer. Team checkpoint API: raw 180 samples at 360 Hz through shared preprocessing.py.</text><text x="80" y="573" class="small">Demo samples and scores are illustrative. No trained checkpoints or MIT-BIH evaluation are included in this release.</text></svg>
